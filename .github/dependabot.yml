version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      substrait:
        patterns:
          - "substrait-protobuf"
          - "substrait-antlr"
          - "substrait-extensions"

  # Keeps the pinned commitlint toolchain in package.json / package-lock.json
  # current; it is only used to lint PR titles and descriptions.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
