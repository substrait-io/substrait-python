name: PR Title Check

on:
  # synchronize is required even though a push changes neither the title nor the
  # description: "PR title / description conforms to semantic-release" is a
  # required status check, and GitHub keys required checks to the head commit.
  # Without synchronize, pushing a new commit strands the check on the previous
  # commit and blocks the PR indefinitely.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Serialize runs for the same PR so the comment job can't race with itself.
#
# cancel-in-progress must stay false: a Dependabot rebase force-pushes and edits
# the PR body at once, firing synchronize and edited on the same commit.
# Cancelling one leaves a cancelled check-run on the head commit that fails the
# status rollup (#198). Letting both finish yields two harmless successes.
#
# queue: max is needed for the same reason. The default, queue: single, allows
# only one pending run and lets a newly arriving run displace it, so the run that
# gets cancelled is simply the waiting one instead of the running one. max allows
# up to 100 pending runs, so both finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

# Default to the minimum read-only token for all jobs.
permissions:
  contents: read

jobs:
  commitlint:
    name: PR title / description conforms to semantic-release
    runs-on: ubuntu-latest
    permissions:
      # contents for the checkout below, pull-requests to read the PR's current
      # title and body. A job-level permissions block replaces the workflow
      # default outright rather than adding to it, so both must be listed.
      contents: read
      pull-requests: read
    outputs:
      outcome: ${{ steps.commitlint.outcome }}
      title: ${{ steps.pr.outputs.title }}
      body: ${{ steps.pr.outputs.body }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # pull_request_target runs the workflow from the base ref and checks out
      # the base ref, so neither this workflow nor commitlint.config.js nor the
      # pinned toolchain can be altered by the PR being validated.
      - uses: actions/checkout@v7
        with:
          # Do not leave the workflow token in .git/config: npm ci runs
          # third-party package code in this same workspace.
          persist-credentials: false
          sparse-checkout: |
            commitlint.config.js
            package.json
            package-lock.json
            .npmrc
          sparse-checkout-cone-mode: false
      # npm ci installs exactly the tree recorded in package-lock.json, so
      # neither a new commitlint release nor a compromised transitive dependency
      # can change what runs here. --ignore-scripts also blocks install hooks.
      - run: npm ci --ignore-scripts
      # Lint the PR's text as it is now, not as the triggering event captured
      # it. This job is the required status check, and GitHub decides it from
      # the most recent check run of this name, so whichever run finishes last
      # must not be deciding it from a payload that has since been superseded.
      # queue: max lets several runs wait at once and the order they are
      # released in is not guaranteed, so a title that has since been corrected
      # could otherwise be overruled by an older run and leave the check stuck
      # red, with no further event to clear it. Reading the current text here
      # makes the verdict independent of run order in both directions.
      - id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("title", pr.title);
            core.setOutput("body", pr.body ?? "");
            // Written to a file rather than passed as an argument or a shell
            // variable, so the untrusted text never reaches a command line.
            require("node:fs").writeFileSync(
              `${process.env.RUNNER_TEMP}/commit-msg.txt`,
              `${pr.title}\n\n${pr.body ?? ""}`,
            );
      # continue-on-error keeps a lint failure distinguishable from an
      # infrastructure failure: only outcome == 'failure' means the title or
      # description is genuinely malformed, and only that should be commented on.
      # --no-install so this can only run the pinned local CLI, never fetch one.
      - id: commitlint
        continue-on-error: true
        run: npx --no-install commitlint --verbose < "$RUNNER_TEMP/commit-msg.txt"
      # Fail this job, rather than the comment job, so that the check which goes
      # red is the one whose name describes what is wrong.
      - if: steps.commitlint.outcome == 'failure'
        run: |
          echo "PR title and description do not follow the Conventional Commits specification." >&2
          exit 1

  comment:
    name: Post / remove PR comment
    runs-on: ubuntu-latest
    needs: commitlint
    # always(), because the lint job now fails when the message is malformed,
    # which is exactly when the comment has to be posted.
    if: always() && contains(fromJSON('["success", "failure"]'), needs.commitlint.outputs.outcome)
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v9
        env:
          # The text the lint job actually linted, passed through the
          # environment rather than interpolated into the script so that a
          # crafted title or body cannot inject JavaScript.
          LINTED_TITLE: ${{ needs.commitlint.outputs.title }}
          LINTED_BODY: ${{ needs.commitlint.outputs.body }}
        with:
          script: |
            // Skip if the PR text has moved on since the lint job read it:
            // the run for that edit will post or clear the comment, and an
            // older run must not undo a newer one's result.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.title !== process.env.LINTED_TITLE || (pr.body ?? "") !== (process.env.LINTED_BODY ?? "")) {
              core.info("PR title or description changed since this run started; leaving it to the newer run.");
              return;
            }

            // Hidden marker used to find this job's comment regardless of wording.
            const marker = "<!-- pr-title-check -->";
            const message = `${marker}
            **ACTION NEEDED**

            Substrait follows the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) for release automation.

            The PR title and description are used as the merge commit message. Please update your PR title and description to match the specification.`;
            const passed = "${{ needs.commitlint.outputs.outcome }}" === "success";

            // Find an existing comment from this job, if any.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            // Match on author as well as marker: the marker is a plain string, so
            // anyone quoting this workflow could otherwise have their comment
            // deleted on a pass, or suppress the warning on a failure.
            const existing = comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body.includes(marker)
            );

            if (passed) {
              // Clean up the comment now that the check passes.
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            // Check failed: post the comment if it isn't already there. The lint
            // job has already gone red, so this job does not need to fail too.
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
