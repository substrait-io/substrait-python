[project]
name = "substrait"
description = "A python package for Substrait."
authors = [{name = "Substrait contributors", email = "substrait@googlegroups.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "protobuf >=5,<7",
    "substrait-protobuf==0.106.0",
    "substrait-extensions==0.106.0",
]
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "src/substrait/_version.py"

[project.optional-dependencies]
extensions = ["substrait-antlr==0.106.0", "pyyaml"]
sql = ["sqloxide", "deepdiff"]

[dependency-groups]
dev = ["pytest >= 7.0.0", "substrait-antlr==0.106.0", "pyyaml", "sqloxide", "deepdiff", "duckdb<=1.2.2; python_version < '3.14'", "datafusion"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"
markers = [
    "integration: exercises a third-party Substrait producer or consumer",
    "pyarrow: integration test against pyarrow's Substrait output; runs by default",
    "duckdb: integration test against duckdb's Substrait consumer; deselected by default",
    "datafusion: integration test against datafusion's Substrait consumer; deselected by default",
]
# The default turns off the two integrations that cannot report their own failure, not
# integration testing as a category. DuckDB and DataFusion consume plans this library
# builds, and handing a lagging consumer a plan built at a newer spec version can crash
# the interpreter natively -- so they must not gate a plain `pytest`, which is what CI
# runs. pyarrow goes the other way (it produces, this library consumes), so it cannot
# take the process down and it currently passes: it runs by default, where it can catch
# a pyarrow release drifting away from the output shape the anchor handling assumes.
# Turn it off by adding `and not pyarrow` here if that day comes.
#
# A `-m` on the command line replaces this one rather than being ANDed with it, so
# `-m integration` runs every integration test and `-m duckdb` runs just that one.
addopts = ["-m", "not duckdb and not datafusion"]

[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm[toml]>=6.2.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
respect-gitignore = true
# should target minimum supported version
target-version = "py310"
lint.extend-select = ["I"]
# The public API raises plain `Exception`; switching to typed exceptions is a separate,
# user-visible change.
lint.extend-ignore = ["TRY002", "TRY004"]

[tool.ruff.lint.per-file-ignores]
# Naive datetimes are deliberate: they model Substrait's timezone-less timestamp literals.
"tests/**" = ["DTZ001"]
# Re-exports the generated protobuf modules wholesale.
"src/substrait/proto/__init__.py" = ["F401", "F403"]


[tool.uv]
# 0.11.8 is the first release that writes a relative exclude-newer into uv.lock
# without a solve timestamp, so the lock does not change on every re-lock.
required-version = ">=0.11.8"
# Ignore PyPI packages published in the last 14 days when locking, so a
# compromised or broken upload has time to be noticed before it can reach a
# build. See CONTRIBUTING.md for how to bypass this for an urgent security fix.
exclude-newer = "14 days"
# We publish these ourselves, so there is no third-party release to let the
# ecosystem vet. Matches their minimumReleaseAge exemption in renovate.json.
exclude-newer-package = { substrait-protobuf = false, substrait-extensions = false, substrait-antlr = false }

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64", "linux-aarch64"]
# The same 14-day cutoff for the conda and PyPI packages pixi solves. 0.67.0 is
# the first release that accepts a relative cutoff and the per-package tables.
exclude-newer = "14d"
requires-pixi = ">=0.67.0"

[tool.pixi.pypi-exclude-newer]
substrait-protobuf = "0d"
substrait-extensions = "0d"
substrait-antlr = "0d"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }
extensions = { features = ["extensions"], solve-group = "default" }
sql = { features = ["sql"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format"
lint = "ruff check"
lint_fix = "ruff check --fix"

[tool.pixi.dependencies]
ruff = ">=0.16.9,<0.17"
