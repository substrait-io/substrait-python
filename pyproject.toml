[project]
name = "substrait"
description = "A python package for Substrait."
authors = [{name = "Substrait contributors", email = "substrait@googlegroups.com"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "protobuf >=5,<7",
    "substrait-protobuf==0.99.0",
    "substrait-extensions==0.99.0",
]
dynamic = ["version"]

[tool.setuptools_scm]
write_to = "src/substrait/_version.py"

[project.optional-dependencies]
extensions = ["substrait-antlr==0.99.0", "pyyaml"]
sql = ["sqloxide", "deepdiff"]

[dependency-groups]
dev = ["pytest >= 7.0.0", "substrait-antlr==0.99.0", "pyyaml", "sqloxide", "deepdiff", "duckdb<=1.2.2; python_version < '3.14'", "datafusion"]
docs = ["zensical", "mkdocstrings-python"]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"

[build-system]
requires = ["setuptools>=61.0.0", "setuptools_scm[toml]>=6.2.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
respect-gitignore = true
# should target minimum supported version
target-version = "py310"
lint.extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# Guide snippet sources (examples/guide/) mirror the documentation: imports are
# shown inside their code sections (and re-shown per page), so import placement
# (E402), re-definition (F811), and import ordering (I001) intentionally follow
# the docs rather than module conventions.
"examples/guide/*.py" = ["E402", "F811", "I001"]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64", "linux-aarch64"]

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }
extensions = { features = ["extensions"], solve-group = "default" }
sql = { features = ["sql"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }

[tool.pixi.tasks]
format = "ruff format"
lint = "ruff check"
lint_fix = "ruff check --fix"

[tool.pixi.feature.docs.tasks]
docs-build = "zensical build"
docs-serve = "zensical serve"

[tool.pixi.dependencies]
ruff = ">=0.14.10,<0.15"
