# Zensical configuration for the substrait-python documentation.
# Docs: https://zensical.org/docs/
#
# Build:  pixi run docs-build   (or: uv run zensical build)
# Serve:  pixi run docs-serve   (or: uv run zensical serve)

[project]
site_name = "substrait-python"
site_description = "Python bindings for Substrait, with an ergonomic DataFrame API for authoring plans."
site_author = "Substrait contributors"
# Canonical hosting URL. Required for multi-version docs: each version is
# published as a subdirectory of this URL. Adjust if the site is served
# elsewhere (custom domain, or a fork's *.github.io while testing).
site_url = "https://substrait-io.github.io/substrait-python/"
repo_url = "https://github.com/substrait-io/substrait-python"
repo_name = "substrait-io/substrait-python"
copyright = "Copyright &copy; 2026 Substrait contributors"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Guide" = [
    { "Data sources" = "data-sources.md" },
    { "Types & schemas" = "types-and-schemas.md" },
    { "Expressions" = "expressions.md" },
    { "The function namespace" = "functions.md" },
    { "Transformations" = "transformations.md" },
    { "Joins" = "joins.md" },
    { "Aggregations" = "aggregations.md" },
    { "Set operations" = "set-operations.md" },
    { "Window functions" = "window-functions.md" },
    { "Subqueries" = "subqueries.md" },
    { "Parameters & context" = "parameters-and-context.md" },
    { "DDL & writes" = "ddl-and-writes.md" },
    { "Custom extensions" = "custom-extensions.md" },
    { "Consuming plans" = "consuming-plans.md" },
  ] },
  { "API reference" = "reference/index.md" },
]

# --------------------------------------------------------------------------
# Multi-version documentation (via the Zensical-compatible `mike` fork).
# Publishing is done by .github/workflows/docs-deploy.yml, which commits each
# version to the `gh-pages` branch as a subdirectory of site_url. Setting the
# provider here renders the version selector in the header.
# --------------------------------------------------------------------------
[project.extra.version]
provider = "mike"   # enables the selector; reads mike's versions.json on gh-pages
default = "latest"  # the alias the site root redirects to
alias = true

# --------------------------------------------------------------------------
# Theme (Material-style; ships with Zensical).
# --------------------------------------------------------------------------
[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/substrait-io/substrait-python"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/substrait/"

# --------------------------------------------------------------------------
# Plugins
# --------------------------------------------------------------------------
# Auto-generated API reference from the package docstrings.
# Install: mkdocstrings-python (in the `docs` dependency group).
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "sphinx"
show_source = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true

# --------------------------------------------------------------------------
# Markdown extensions (Zensical defaults + what the guide relies on).
# --------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
